/auth/login:
  post:
    summary: User login
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                format: email
                example: john@example.com
              password:
                type: string
                example: password123
    responses:
      200:
        description: User found and logged in successfully
      400:
        description: Validation error
      404:
        description: User not found
      500:
        description: Internal server error

/auth/signup:
  post:
    summary: Create a new user account (Direct)
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - email
              - password
            properties:
              name:
                type: string
                example: John Doe
              email:
                type: string
                format: email
                example: john@example.com
              password:
                type: string
                minLength: 8
                example: password123
    responses:
      201:
        description: User account created successfully
      400:
        description: Validation error
      409:
        description: User already exists
      500:
        description: Internal server error

/auth/signup/initiate:
  post:
    summary: Initiate signup by sending a 4-digit OTP code to the email
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - email
              - password
            properties:
              name:
                type: string
                example: John Doe
              email:
                type: string
                format: email
                example: john@example.com
              password:
                type: string
                minLength: 8
                example: password123
    responses:
      200:
        description: Verification code sent successfully
      400:
        description: Validation error
      409:
        description: User already exists with this email
      429:
        description: Too many requests
      500:
        description: Internal server error

/auth/signup/resend:
  post:
    summary: Resend a 4-digit OTP code for pending signup
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
                example: john@example.com
    responses:
      200:
        description: New verification code sent successfully
      400:
        description: No pending signup verification found
      429:
        description: Resend cooldown active (wait 2 minutes)
      500:
        description: Internal server error

/auth/signup/verify:
  post:
    summary: Verify 4-digit OTP, create user account, and return login session
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - otp
            properties:
              email:
                type: string
                format: email
                example: john@example.com
              otp:
                type: string
                example: "1234"
    responses:
      201:
        description: Account created and verified successfully
      400:
        description: Invalid/expired OTP or too many attempts
      409:
        description: User already exists
      500:
        description: Internal server error

/auth/reset-password:
  post:
    summary: Reset user password using token
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - password
              - token
            properties:
              password:
                type: string
                minLength: 8
                example: password1234
              token:
                type: string
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    responses:
      200:
        description: Password updated successfully
      400:
        description: Missing or invalid token / validation error
      500:
        description: Internal server error

/auth/forgot-password:
  post:
    summary: Send password reset email with a token
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
                example: john@example.com
    responses:
      200:
        description: If that email exists, a reset link has been sent.
      400:
        description: Validation error
      429:
        description: Too many requests
      500:
        description: Internal server error
