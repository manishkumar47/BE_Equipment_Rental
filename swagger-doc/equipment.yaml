/equipments:
  post:
    summary: Create a new equipment item
    tags: [Equipment]
    security:
      - AuthorizationAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - price
            properties:
              name:
                type: string
                example: Laptop
              description:
                type: string
                example: Dell Inspiron laptop
              quantity:
                type: integer
                example: 5
              price:
                type: number
                format: float
                example: 1000.0
    responses:
      201:
        description: Equipment created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Equipment created!
                data:
                  type: object
      500:
        description: Internal server error
  get:
    summary: Get all equipment items (excludes soft-deleted items)
    tags: [Equipment]
    responses:
      200:
        description: Equipment fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Equipment fetched!
                data:
                  type: array
                  items:
                    type: object
      500:
        description: Internal server error

/equipments/bulk:
  post:
    summary: Bulk-create multiple equipment items (admin only, CSV import)
    tags: [Equipment]
    security:
      - AuthorizationAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  type: object
                  required:
                    - name
                    - price
                    - categoryId
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    quantity:
                      type: integer
                    price:
                      type: number
                    imageUrl:
                      type: string
                    categoryId:
                      type: integer
    responses:
      201:
        description: Equipment items created successfully
      400:
        description: Validation error
      500:
        description: Internal server error

/equipments/{id}:
  get:
    summary: Get equipment item by ID
    tags: [Equipment]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      200:
        description: Equipment fetched successfully
      404:
        description: Equipment not found
      500:
        description: Internal server error
  put:
    summary: Update an equipment item
    tags: [Equipment]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                example: Laptop
              description:
                type: string
                example: Dell Inspiron laptop
              quantity:
                type: integer
                example: 5
              price:
                type: number
                format: float
                example: 1000.0
    responses:
      200:
        description: Equipment updated successfully
      500:
        description: Internal server error
  delete:
    summary: Soft-delete an equipment item (admin only)
    tags: [Equipment]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      200:
        description: Equipment soft-deleted successfully
      500:
        description: Internal server error
