/rental-bookings:
  post:
    summary: Create a rental booking request
    description: >
      Creates a booking in 'requested' status and reserves the stock.
      An admin must approve it (POST /admin/rental-bookings/{id}/approve)
      before it becomes 'active', or reject it to release the stock.
    tags: [RentalBooking]
    security:
      - AuthorizationAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - rentFrom
              - rentTo
              - equipmentId
            properties:
              rentFrom:
                type: string
                format: date-time
                example: 2026-08-10T10:00:00.000Z
              rentTo:
                type: string
                format: date-time
                example: 2026-08-12T10:00:00.000Z
              quantity:
                type: integer
                example: 2
              equipmentId:
                type: integer
                example: 2
    responses:
      201:
        description: Rental booking created successfully
      400:
        description: Invalid request payload
      401:
        description: Unauthorized
      403:
        description: Forbidden
      500:
        description: Internal server error
  get:
    summary: Get rental bookings (admin gets all, user gets own)
    tags: [RentalBooking]
    security:
      - AuthorizationAuth: []
    responses:
      200:
        description: Bookings fetched successfully
      401:
        description: Unauthorized
      500:
        description: Internal server error

/rental-bookings/my:
  get:
    summary: Get current user's rental bookings
    tags: [RentalBooking]
    security:
      - AuthorizationAuth: []
    responses:
      200:
        description: User bookings fetched successfully
      401:
        description: Unauthorized
      500:
        description: Internal server error

/rental-bookings/{id}:
  get:
    summary: Get a rental booking by ID
    tags: [RentalBooking]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      200:
        description: Booking fetched successfully
      401:
        description: Unauthorized
      403:
        description: Forbidden
      404:
        description: Booking not found
      500:
        description: Internal server error
  delete:
    summary: Soft-delete a rental booking
    tags: [RentalBooking]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      200:
        description: Booking soft-deleted successfully
      401:
        description: Unauthorized
      403:
        description: Forbidden
      404:
        description: Booking not found
      500:
        description: Internal server error

/admin/rental-bookings/requests:
  get:
    summary: Get pending booking requests (admin only, paginated)
    description: >
      Returns bookings where status is 'requested', with user and
      equipment details. Supports pagination via query params.
    tags: [Admin Rental Bookings]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
      - in: query
        name: search
        schema:
          type: string
    responses:
      200:
        description: Pending booking requests fetched
      401:
        description: Unauthorized
      403:
        description: Forbidden (admin only)
      500:
        description: Internal server error

/admin/rental-bookings/{id}/approve:
  post:
    summary: Approve a booking request (admin only)
    description: >
      Transitions the booking from 'requested' to 'active'. If the
      equipment has enough available tracked physical units
      (equipment_items), auto-assigns them to the booking and marks
      them 'rented'. Assignment is opportunistic — approval succeeds
      either way.
    tags: [Admin Rental Bookings]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      200:
        description: Booking approved successfully
      400:
        description: Invalid booking ID
      401:
        description: Unauthorized
      403:
        description: Forbidden (admin only)
      404:
        description: Booking not found
      409:
        description: Booking is not in 'requested' state / already processed
      500:
        description: Internal server error

/admin/rental-bookings/{id}/reject:
  post:
    summary: Reject a booking request (admin only)
    description: >
      Transitions the booking from 'requested' to 'rejected' and
      restores the equipment stock reserved at request time.
    tags: [Admin Rental Bookings]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - rejectionReason
            properties:
              rejectionReason:
                type: string
                example: No stock available at pickup time
    responses:
      200:
        description: Booking rejected successfully
      400:
        description: Invalid request (missing reason)
      401:
        description: Unauthorized
      403:
        description: Forbidden (admin only)
      404:
        description: Booking not found
      409:
        description: Booking is not in 'requested' state / already processed
      500:
        description: Internal server error
