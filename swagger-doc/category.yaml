/category/all:
  get:
    summary: Get all categories (excludes soft-deleted items)
    tags: [Category]
    responses:
      200:
        description: Category fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Cateogories fetched!
                data:
                  type: array
                  items:
                    type: object
      500:
        description: Internal server error
