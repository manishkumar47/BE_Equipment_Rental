/fines/my:
  get:
    summary: Get the authenticated user's fines
    description: >
      Returns all fines belonging to the current user (late/damage/lost
      charges from confirmed returns), each with its due date (5 days
      from creation) and payment status.
    tags: [Fines]
    security:
      - AuthorizationAuth: []
    responses:
      200:
        description: Fines fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      fine:
                        type: object
                        properties:
                          id:
                            type: integer
                          amount:
                            type: number
                          daysLate:
                            type: integer
                          reason:
                            type: string
                          status:
                            type: string
                            enum: [unpaid, paid, waived]
                          createdAt:
                            type: string
                            format: date-time
                          dueDate:
                            type: string
                            format: date-time
                      booking:
                        type: object
                      equipment:
                        type: object
      401:
        description: Unauthorized
      500:
        description: Internal server error

/fines/{id}/pay:
  post:
    summary: Pay a fine (stub — no real payment gateway yet)
    description: >
      Marks the fine as paid. Currently a placeholder click-to-pay
      action with no real payment processing; a payment gateway will
      be integrated later.
    tags: [Fines]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    responses:
      200:
        description: Fine paid successfully
      400:
        description: Invalid fine ID
      401:
        description: Unauthorized
      403:
        description: Not authorized (fine belongs to a different user)
      404:
        description: Fine not found
      409:
        description: Fine is not 'unpaid' (already paid/waived)
      500:
        description: Internal server error
