/equipments/{id}/items:
  get:
    summary: List physical units (items) registered for an equipment (admin only)
    tags: [Equipment Items]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The equipment (type/model) ID
    responses:
      200:
        description: Equipment items fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Equipment items fetched!
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      equipmentId:
                        type: integer
                      serialNumber:
                        type: string
                      status:
                        type: string
                        enum: [available, rented, under_repair, damaged, lost, retired]
                      conditionNotes:
                        type: string
      404:
        description: Equipment not found
      401:
        description: Unauthorized
      403:
        description: Forbidden (admin only)
      500:
        description: Internal server error
  post:
    summary: Register a physical unit (item) for an equipment (admin only)
    tags: [Equipment Items]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The equipment (type/model) ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - serialNumber
            properties:
              serialNumber:
                type: string
                example: DRILL-3-001
              status:
                type: string
                enum: [available, rented, under_repair, damaged, lost, retired]
                default: available
              conditionNotes:
                type: string
                example: Brand new, no scratches
    responses:
      201:
        description: Equipment item registered successfully
      400:
        description: Validation error
      404:
        description: Equipment not found
      409:
        description: Serial number already in use
      401:
        description: Unauthorized
      403:
        description: Forbidden (admin only)
      500:
        description: Internal server error

/equipments/{id}/items/bulk:
  post:
    summary: Register multiple physical units (items) for an equipment at once (admin only)
    tags: [Equipment Items]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The equipment (type/model) ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  type: object
                  required:
                    - serialNumber
                  properties:
                    serialNumber:
                      type: string
                    status:
                      type: string
                      enum: [available, rented, under_repair, damaged, lost, retired]
                    conditionNotes:
                      type: string
    responses:
      201:
        description: Equipment items registered successfully
      400:
        description: Validation error
      404:
        description: Equipment not found
      409:
        description: One or more serial numbers already in use
      401:
        description: Unauthorized
      403:
        description: Forbidden (admin only)
      500:
        description: Internal server error

/equipments/{id}/items/{itemId}:
  patch:
    summary: Update a physical unit's serial number, status, or condition notes (admin only)
    tags: [Equipment Items]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The equipment (type/model) ID
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
        description: The equipment item ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              serialNumber:
                type: string
              status:
                type: string
                enum: [available, rented, under_repair, damaged, lost, retired]
              conditionNotes:
                type: string
    responses:
      200:
        description: Equipment item updated successfully
      400:
        description: Validation error
      404:
        description: Equipment item not found
      409:
        description: Serial number already in use
      401:
        description: Unauthorized
      403:
        description: Forbidden (admin only)
      500:
        description: Internal server error
  delete:
    summary: Soft-delete a physical unit (admin only)
    tags: [Equipment Items]
    security:
      - AuthorizationAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
        description: The equipment (type/model) ID
      - in: path
        name: itemId
        required: true
        schema:
          type: integer
        description: The equipment item ID
    responses:
      200:
        description: Equipment item deleted successfully
      404:
        description: Equipment item not found
      401:
        description: Unauthorized
      403:
        description: Forbidden (admin only)
      500:
        description: Internal server error
